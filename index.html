<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lưu ảnh theo địa điểm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📍%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#222;--mu:#777;--ac:#c2410c;--bd:#e3e0d8}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--card:#262522;--tx:#eee;--mu:#999;--ac:#fb923c;--bd:#3a3834}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex}
aside{width:260px;border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
main{flex:1;padding:18px;overflow:auto}
h1{font-size:17px;margin:0}
input,button{font:inherit}
input{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:hover{opacity:.85}
.loc{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.loc.on{background:var(--ac);color:#fff}
.loc small{opacity:.75}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:30px;text-align:center;color:var(--mu);margin-bottom:14px;background:var(--card)}
#drop.over{border-color:var(--ac);color:var(--ac)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;font-size:12px}
.it img{width:100%;height:130px;object-fit:contain;background:#0001;display:block}
.it div{padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it button{padding:2px 7px;font-size:12px}
#st{color:var(--mu);font-size:13px}
.map{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card);margin-bottom:6px}
.pinwrap{background:none;border:0}
.pin{font-size:26px;line-height:1;position:relative}
.pin b{position:absolute;top:-6px;right:-10px;background:var(--ac);color:#fff;font:600 11px system-ui;border-radius:9px;padding:1px 5px}
.hint{color:var(--mu);font-size:12px;margin-bottom:14px}
#minimap{height:420px}
#minimap.tall{height:75vh}
@media(max-width:700px){body{flex-direction:column;height:auto}aside{width:100%;border:0}}

.it .bt{overflow:visible;display:flex;gap:4px;flex:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column}
#lb .bar{display:flex;gap:8px;align-items:center;padding:10px 14px;color:#fff}
#lb .bar span{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb button{background:#ffffff22;color:#fff;border-color:#ffffff40}
#lbw{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center}
#lbi{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
#lbw.z{display:block}
#lbw.z #lbi{max-width:none;max-height:none;cursor:zoom-out}
#lb .nv{position:fixed;top:50%;transform:translateY(-50%);font-size:28px;padding:8px 14px;z-index:2}
#lb .nv.l{left:10px}#lb .nv.r{right:10px}
#toastP{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#15803d;color:#fff;padding:8px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toastP.on{opacity:1}
#cx{position:fixed;inset:0;background:#0008;z-index:45;display:grid;place-items:center}
.cxb{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;width:min(760px,94vw);max-height:90vh;overflow:auto}
.cxb h2{margin:0 0 4px;font-size:18px}
.cxb label{display:flex;gap:6px;align-items:center;font-size:14px}
#cxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.cxh{grid-column:1/-1;font-size:13px;font-weight:700;margin-top:6px}
.cxi{position:relative;border:3px solid var(--bd);border-radius:8px;overflow:hidden;cursor:pointer;opacity:.55}
.cxi.on{border-color:var(--ac);opacity:1}
.cxi img{width:100%;height:80px;object-fit:cover;display:block}
.cxi b{position:absolute;top:4px;right:4px;background:var(--ac);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:none;place-items:center}
.cxi.on b{display:grid}
#pa{display:none}
.loc.dh{color:var(--mu);font-size:13px;margin-top:8px;border-top:1px solid var(--bd);border-radius:0 0 8px 8px}
#doneBar{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#xbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:40;background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px #0003;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:92vw}
@page{margin:12mm}
@media print{
 body>*:not(#pa){display:none!important}
 body{display:block!important;height:auto!important;background:#fff!important;color:#000!important}
 #pa{display:block!important;color:#000;font-family:system-ui,"Segoe UI",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #pa h1{font-size:20px;margin:0 0 4px}
 #pa .info{font-size:13px;margin:0 0 3px}
 #pa .pg{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:6mm;margin-top:8px}
 #pa h2{font-size:16px;margin:0 0 6px}
 #pa figure{margin:0;break-inside:avoid}
 #pa img{width:100%;max-height:var(--mh,105mm);object-fit:contain;background:#f3f3f3}
 #pa figcaption{font-size:11px;color:#555}
 #pa .psec{margin-bottom:10mm}
 #pa .psec+.psec{break-before:page}
}
</style>
</head>
<body>
<aside>
  <h1>Địa điểm</h1>
  <div style="display:flex;gap:6px"><button id="vp" class="p" style="flex:1">📷 Xem ảnh</button><button id="vm" style="flex:1">🗺 Bản đồ chung</button></div>
  <div style="display:flex;gap:6px"><input id="nl" placeholder="Tỉnh / địa điểm mới (vd: Hưng Yên)"><button class="p" id="add">+</button></div>
  <div id="locs"></div>
  <hr style="width:100%;border:0;border-top:1px solid var(--bd)">
  <button id="pick">📁 Chọn thư mục lưu trên máy</button>
  <div id="st">Chưa chọn thư mục — ảnh sẽ tải về thư mục Downloads.</div>
  <button id="all">Lưu tất cả địa điểm</button>
  <button id="pdfall">📄 Xuất PDF mục chưa xuất</button>
  <button id="expk">👤 Xuất sang Hồ sơ khách hàng</button>
</aside>
<main>
  <div id="empty"></div>
  <div id="ovw" hidden>
    <div class="row"><h1 style="flex:1">Bản đồ các địa điểm</h1><button id="geoall">Tìm vị trí cho tất cả</button></div>
    <div id="bigmap" class="map" style="height:65vh"></div>
    <div id="nopos" class="hint"></div>
  </div>
  <div id="work" hidden>
    <div class="row"><h1 id="tt" style="flex:1"></h1>
      <button id="sub" class="p">+ Địa chỉ cụ thể</button>
      <button id="save">Lưu địa điểm này</button>
      <button id="pdf">📄 Xuất PDF</button>
      <button id="cust">📤 Xuất cho khách</button>
      <button id="ren">Đổi tên</button>
      <button id="del">Xóa địa điểm</button></div>
    <div id="doneBar" class="hint" hidden></div>
    <div class="row" id="info"><input id="ph" type="tel" placeholder="Số điện thoại" style="max-width:220px"><input id="nt" placeholder="Ghi chú (tên khách, nhu cầu...)" style="flex:1;min-width:200px"></div>
    <div id="mapbox">
      <div class="row" style="margin-bottom:8px"><input id="mq" placeholder="Địa chỉ để tìm trên bản đồ (bỏ trống = dùng tên địa điểm)" style="flex:1;min-width:220px"><button id="find">🔍 Tìm vị trí</button><button id="gm">Chỉ đường (Google Maps)</button><button id="tg">⤢ Phóng to</button></div>
      <div id="minimap" class="map"></div>
      <div id="mhint" class="hint"></div>
    </div>
    <div id="drop">Dán ảnh (Ctrl+V), kéo thả ảnh vào đây, hoặc <button id="file">chọn ảnh</button></div>
    <div id="grid"></div>
  </div>
</main>
<div id="pa"></div>
<div id="lb" hidden><div class="bar"><span id="lbn"></span><button id="lbc">📋 Sao chép ảnh</button><button id="lbd">⬇ Tải về</button><button id="lbx">✕ Đóng</button></div><div id="lbw"><img id="lbi" alt=""></div><button class="nv l" id="lbl">‹</button><button class="nv r" id="lbr">›</button></div>
<div id="cx" hidden><div class="cxb">
  <h2>📤 Xuất PDF cho khách</h2>
  <p class="hint">PDF gửi khách chỉ có ảnh bạn chọn. Không có số điện thoại, ghi chú nội bộ, tên file hay link vị trí.</p>
  <div class="row" style="margin-bottom:8px"><label style="flex:1;min-width:220px">Tiêu đề <input id="cxt" placeholder="Tên công trình / tên khách"></label></div>
  <div class="row"><label><input type="checkbox" id="cxa" style="width:auto"> Kèm địa chỉ</label><label><input type="checkbox" id="cxn" style="width:auto"> Đánh số ảnh</label><label>Ảnh mỗi hàng <select id="cxc" style="width:auto;padding:6px"><option>1</option><option selected>2</option><option>3</option></select></label></div>
  <div id="cxg"></div>
  <div class="row"><button id="cxall">Chọn tất cả / bỏ chọn</button><span style="flex:1"></span><button id="cxno">Hủy</button><button id="cxgo" class="p">Xuất PDF</button></div>
</div></div>
<div id="toastP"></div>
<div id="xbar" hidden><span id="xtx"></span><button id="xok" class="p">✔ Chuyển vào “Đã xuất PDF”</button><button id="xno">Để lại</button></div>
<input type="file" id="fi" accept="image/*" multiple hidden>
<script>
const $=id=>document.getElementById(id);
let db,locs=[],imgs=[],cur='none',dir=null,view='photos',showDone=false;
const LF=window.L;
const hasLL=X=>typeof X.lat==='number'&&typeof X.lng==='number';
const NONE={id:'none',name:'Chưa có địa điểm'};
const findL=id=>id==='none'?NONE:locs.find(l=>l.id===id);
const PA=L=>L.parent&&findL(L.parent);
const fname=L=>PA(L)?safe(PA(L).name)+'_'+safe(L.name):safe(L.name);
const parts=L=>PA(L)?[safe(PA(L).name),safe(L.name)]:[safe(L.name)];
const lbl=L=>L.parent?'└ '+L.name:L.name;
const full=L=>PA(L)?PA(L).name+' › '+L.name:L.name;
const order=()=>{const r=[NONE];locs.filter(l=>!l.parent).sort((a,b)=>a.t-b.t).forEach(t=>{r.push(t);locs.filter(c=>c.parent===t.id).sort((a,b)=>a.t-b.t).forEach(c=>r.push(c))});return r};
function mkName(L,ext,skip){let n=count(L.id)+1,name;do{name=fname(L)+'_'+String(n++).padStart(3,'0')+'.'+ext}while(imgs.some(i=>i.loc===L.id&&i.name===name&&i!==skip));return name}
const safe=s=>s.replace(/[\\/:*?"<>|]/g,'_').trim()||'khong-ten';
function open(){return new Promise((ok,no)=>{const r=indexedDB.open('luu-anh',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('locs',{keyPath:'id'});r.result.createObjectStore('imgs',{keyPath:'id'})};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

async function load(){
 try{db=await open();locs=await tx('locs','readonly',s=>s.getAll());imgs=await tx('imgs','readonly',s=>s.getAll())}catch(e){locs=[];imgs=[]}
 locs.sort((a,b)=>a.t-b.t);cur='none';draw();
}
const count=id=>imgs.filter(i=>i.loc===id).length;
const thumbs=new Map();
function thumbURL(i){
 if(thumbs.has(i.id))return thumbs.get(i.id);
 const p=(async()=>{
  try{
   const bm=await createImageBitmap(i.blob);const r=Math.min(1,320/bm.width);
   const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bm.width*r));c.height=Math.max(1,Math.round(bm.height*r));
   c.getContext('2d').drawImage(bm,0,0,c.width,c.height);if(bm.close)bm.close();
   return c.toDataURL('image/webp',0.85);
  }catch(e){
   return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res('');fr.readAsDataURL(i.blob)});
  }
 })();
 thumbs.set(i.id,p);return p;
}
function dropThumb(id){thumbs.delete(id)}
function showErr(m){let b=$('err');if(!b){b=document.createElement('div');b.id='err';b.style.cssText='position:fixed;bottom:10px;right:10px;max-width:360px;background:#b91c1c;color:#fff;padding:10px 12px;border-radius:8px;font-size:13px;z-index:9999;cursor:pointer';b.onclick=()=>b.remove();document.body.appendChild(b)}b.textContent='Có lỗi: '+m+' (bấm để tắt)'}
window.addEventListener('error',e=>showErr(e.message));
window.addEventListener('unhandledrejection',e=>showErr((e.reason&&e.reason.message)||String(e.reason)));
function draw(){
 $('locs').innerHTML='';
 order().filter(l=>!l.done).forEach(l=>{const d=document.createElement('div');d.className='loc'+(l.id===cur?' on':'');
  const tot=count(l.id)+locs.filter(c=>c.parent===l.id).reduce((a,c)=>a+count(c.id),0);
  d.innerHTML='<span></span><small>'+tot+'</small>';d.firstChild.textContent=lbl(l)+(l.phone?' · '+l.phone:'');if(l.parent)d.style.paddingLeft='24px';
  d.onclick=()=>{cur=l.id;view='photos';draw()};$('locs').appendChild(d)});
 const dn=locs.filter(l=>l.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
 if(dn.length){
  const h=document.createElement('div');h.className='loc dh';h.innerHTML='<span></span><small></small>';
  h.firstChild.textContent=(showDone?'▾ ':'▸ ')+'📁 Đã xuất PDF';h.lastChild.textContent=dn.length;
  h.onclick=()=>{showDone=!showDone;draw()};$('locs').appendChild(h);
  if(showDone)dn.forEach(l=>{const d=document.createElement('div');d.className='loc'+(l.id===cur?' on':'');d.style.paddingLeft='20px';
   d.innerHTML='<span></span><small>'+count(l.id)+'</small>';d.firstChild.textContent=full(l);
   d.onclick=()=>{cur=l.id;view='photos';draw()};$('locs').appendChild(d)});
 }
 $('vp').className=view==='photos'?'p':'';$('vm').className=view==='map'?'p':'';
 $('ovw').hidden=view!=='map';
 if(view==='map'){$('work').hidden=true;$('empty').hidden=true;showBig();return}
 const L=findL(cur);
 $('empty').hidden=!!L;$('work').hidden=!L;
 if(!L)return;
 $('tt').textContent=full(L);$('sub').hidden=cur==='none'||!!L.parent;
 $('info').hidden=cur==='none';$('ph').value=L.phone||'';$('nt').value=L.note||'';
 $('ren').hidden=$('del').hidden=cur==='none';
 $('mapbox').hidden=cur==='none';
 {const db=$('doneBar');db.hidden=!(cur!=='none'&&L.done);
  if(!db.hidden){db.innerHTML='';const sp=document.createElement('span');
   sp.textContent='📁 Đã xuất PDF'+(L.doneAt?' ngày '+new Date(L.doneAt).toLocaleDateString('vi-VN'):'')+'. Mục này không bị xuất lại khi bấm “Xuất PDF mục chưa xuất”.';
   const bt=document.createElement('button');bt.textContent='↩ Đưa ra khỏi thư mục';bt.onclick=async()=>{await setDone(L,false);toast('Đã đưa ra khỏi “Đã xuất PDF”.');draw()};
   db.append(sp,bt)}}
 if(cur!=='none'){$('mq').value=L.addr||'';$('mhint').textContent=hasLL(L)?'Kéo ghim hoặc bấm lên bản đồ để chỉnh vị trí.':'Chưa có ghim: bấm "Tìm vị trí" hoặc bấm trực tiếp lên bản đồ.';showMini(L)}
 const g=$('grid');g.innerHTML='';
 const LST=imgs.filter(i=>i.loc===cur).sort((a,b)=>a.t-b.t);
 LST.forEach((i,ix)=>{
  const d=document.createElement('div');d.className='it';
  d.innerHTML='<img alt="" loading="lazy" title="Bấm để xem ảnh lớn" style="cursor:zoom-in"><div><span></span><span class="bt"><button class="cpi" title="Sao chép ảnh">📋</button><button class="rm" title="Xóa">✕</button></span></div><div><select style="width:100%;font-size:12px"></select></div>';
  d.querySelector('span').textContent=i.name;
  const im=d.querySelector('img');thumbURL(i).then(u=>{im.src=u});im.onclick=()=>openLB(LST,ix);d.querySelector('.cpi').onclick=e=>{e.stopPropagation();copyImg(i)};
  const sel=d.querySelector('select');
  order().forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=(l.id===i.loc?'📍 ':'➜ ')+lbl(l);if(l.id===i.loc)o.selected=true;sel.appendChild(o)});
  sel.onchange=async()=>{const T=findL(sel.value);if(T.done)await setDone(T,false);i.loc=T.id;i.name=mkName(T,i.name.split('.').pop(),i);await tx('imgs','readwrite',s=>s.put(i));if(dir&&T.id!=='none')await saveOne(i,T).catch(()=>{});draw()};
  d.querySelector('.rm').onclick=async()=>{if(!confirm('Xóa ảnh này?'))return;await tx('imgs','readwrite',s=>s.delete(i.id));dropThumb(i.id);imgs=imgs.filter(x=>x.id!==i.id);draw()};
  g.appendChild(d)});
}
async function addLoc(){
 const n=$('nl').value.trim();if(!n)return;
 const l={id:uid(),name:n,t:Date.now()};
 await tx('locs','readwrite',s=>s.put(l));locs.push(l);cur=l.id;$('nl').value='';draw();
}
$('add').onclick=addLoc;$('nl').onkeydown=e=>{if(e.key==='Enter')addLoc()};
$('ren').onclick=async()=>{const L=findL(cur);const n=prompt('Tên mới:',L.name);if(!n||!n.trim())return;L.name=n.trim();await tx('locs','readwrite',s=>s.put(L));draw()};
$('del').onclick=async()=>{const L=findL(cur);const kids=locs.filter(c=>c.parent===L.id);
 if(!confirm('Xóa "'+L.name+(kids.length?'", các địa chỉ con':'')+' và toàn bộ ảnh trong đó?'))return;
 const ids=[L.id,...kids.map(c=>c.id)];
 for(const i of imgs.filter(i=>ids.includes(i.loc))){await tx('imgs','readwrite',s=>s.delete(i.id));dropThumb(i.id)}
 for(const id of ids)await tx('locs','readwrite',s=>s.delete(id));
 imgs=imgs.filter(i=>!ids.includes(i.loc));locs=locs.filter(l=>!ids.includes(l.id));cur='none';draw()};
$('sub').onclick=async()=>{const P=findL(cur);const n=prompt('Địa chỉ cụ thể trong "'+P.name+'" (vd: Quỳnh Phụ):');if(!n||!n.trim())return;
 const l={id:uid(),name:n.trim(),parent:P.id,t:Date.now()};await tx('locs','readwrite',s=>s.put(l));if(P.done)await setDone(P,false);locs.push(l);cur=l.id;draw()};

async function addBlobs(blobs){
 const L=findL(cur)||NONE;
 for(const b of blobs){
  if(!b.type.startsWith('image/'))continue;
  const ext=(b.type.split('/')[1]||'png').replace('jpeg','jpg').replace('+xml','');
  const name=mkName(L,ext);
  const it={id:uid(),loc:L.id,name,blob:b,t:Date.now()};
  await tx('imgs','readwrite',s=>s.put(it));imgs.push(it);
  if(dir&&L.id!=='none')await saveOne(it,L).catch(()=>{});
 }
 if(L.done){await setDone(L,false);toast('Địa điểm này có ảnh mới nên được đưa ra khỏi “Đã xuất PDF”.')}
 draw();
}
document.addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])];if(f.length){e.preventDefault();addBlobs(f)}});
const dz=$('drop');
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));

async function geocode(q){
 let e1=null,e2=null;
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=vn&accept-language=vi&q='+encodeURIComponent(q));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();if(j[0])return{lat:+j[0].lat,lng:+j[0].lon};
 }catch(e){e1=e}
 try{
  const r=await fetch('https://photon.komoot.io/api/?limit=1&q='+encodeURIComponent(q));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();const f=j.features&&j.features[0];
  if(f)return{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]};
 }catch(e){e2=e}
 if(e1&&e2)throw new Error('Nominatim: '+e1.message+' | Photon: '+e2.message);
 return null;
}
async function geocodeSmart(q){
 const raw=q.split(',').map(t=>t.replace(/[.\s]+$/,'').trim()).filter(Boolean);
 const parts=raw.filter((t,i)=>i===0||t!==raw[i-1]);
 for(let k=0;k<Math.min(3,parts.length);k++){
  const qq=parts.slice(k).join(', ');
  const r=await geocode(qq);
  if(r){r.matched=qq;r.exact=k===0;return r}
  await sleep(1100);
 }
 return null;
}

async function toPNG(b){
 if(b.type==='image/png')return b;
 const bm=await createImageBitmap(b);const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;
 c.getContext('2d').drawImage(bm,0,0);if(bm.close)bm.close();
 return await new Promise(r=>c.toBlob(r,'image/png'));
}
async function copyImg(i){
 let png;
 try{png=await toPNG(i.blob)}catch(e){toast('Không đọc được ảnh này.');return}
 const tries=[
  async()=>{await navigator.clipboard.write([new ClipboardItem({'image/png':png})])},
  async()=>{const P=window.parent;await P.navigator.clipboard.write([new P.ClipboardItem({'image/png':png})])},
  async()=>{
   const u=URL.createObjectURL(png);
   try{
    const d=document.createElement('div');d.contentEditable='true';d.style.cssText='position:fixed;left:-9999px;top:0';
    const im=new Image();im.src=u;await im.decode();d.appendChild(im);document.body.appendChild(d);
    const r=document.createRange();r.selectNode(im);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
    const ok=document.execCommand('copy');d.remove();sel.removeAllRanges();
    if(!ok)throw new Error('copy');
   }finally{URL.revokeObjectURL(u)}
  }
 ];
 for(const t of tries){
  try{await t();toast('Đã sao chép ảnh ✓ Dán (Ctrl+V) vào Zalo hoặc tin nhắn');return}catch(e){}
 }
 toast('Không sao chép được ảnh. Hãy dùng nút Tải về.');
}

async function small(i){
 try{
  const bm=await createImageBitmap(i.blob);const r=Math.min(1,1600/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*r);c.height=Math.round(bm.height*r);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);if(bm.close)bm.close();
  return URL.createObjectURL(await new Promise(res=>c.toBlob(res,'image/jpeg',0.88)));
 }catch(e){return URL.createObjectURL(i.blob)}
}

async function exportPDF(list,title){

 toast('Đang chuẩn bị PDF…');

  if(ims.length){

   for(const i of ims){
    const u=await small(i);pUrls.push(u);
    const f=document.createElement('figure');f.innerHTML='<img alt=""><figcaption></figcaption>';
    f.querySelector('img').src=u;f.querySelector('figcaption').textContent=i.name;g.appendChild(f);

 if(!any){toast('Chưa có ảnh hay thông tin để xuất.');return}
 await Promise.all([...pa.querySelectorAll('img')].map(im=>im.decode().catch(()=>{})));
 pExp=used;

 window.print();
}

 const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bm.width*r));c.height=Math.max(1,Math.round(bm.height*r));
 c.getContext('2d').drawImage(bm,0,0,c.width,c.height);if(bm.close)bm.close();
 return c.toDataURL('image/jpeg',0.82);
}

  if(!L.phone&&!L.note&&!pics.length)continue;
  const houses=[];for(const i of pics){try{houses.push(await shrinkBlob(i.blob))}catch(e){}}
  out.push({name:L.note||L.name,phone:L.phone||'',addr:full(L),houses});
 }
 if(!out.length){st.textContent='Chưa có địa điểm nào có số điện thoại, ghi chú hoặc ảnh để xuất.';return}
 const b=new Blob([JSON.stringify({app:'luu-anh',v:1,customers:out})],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='khach_hang.json';
 document.body.appendChild(a);a.click();a.remove();
 st.textContent='Đã xuất '+out.length+' khách ra file khach_hang.json (trong thư mục Downloads).';
};
load();
</script>
